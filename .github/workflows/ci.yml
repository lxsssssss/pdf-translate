name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install CJK fonts
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        python -m playwright install --with-deps chromium

    - name: Syntax & Compilation Check
      run: |
        python -m py_compile scripts/audit_pdf.py scripts/render_pdf.py examples/quick_demo.py

    - name: Unit & integration tests
      run: python -m pytest

    - name: Run End-to-End Quick Demo
      run: python examples/quick_demo.py

    - name: Upload demo artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: demo-output-py${{ matrix.python-version }}
        path: examples/output/
        if-no-files-found: ignore
